name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Local build
        id: local_build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            Version=dev
            GitCommit=${{ github.sha }}
          outputs: "type=docker,push=false"
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Setup Kubernetes
        uses: helm/kind-action@v1
        with:
          cluster_name: kind
          version: "v0.33.0"
          node_image: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"

      - name: Load test image
        run: kind load docker-image "$IMAGE:${GITHUB_SHA}"
      - name: Apply manifests
        run: |
          TAG="$GITHUB_SHA" IMAGE="$IMAGE" make shrinkwrap
          cat ./manifest.yaml | grep ghcr
          kubectl apply -f ./manifest.yaml

      - name: Check deployment
        run:
          kubectl rollout status -n registry-creds-system deploy/registry-creds-registry-creds-controller --timeout=2m || kubectl describe -n registry-creds-system deploy/registry-creds-registry-creds-controller && kubectl get events -n registry-creds-system

      - name: Check ClusterPullSecret replication
        run: |
          kubectl create secret generic registry-creds-ci-seed \
            --namespace=kube-system \
            --type=kubernetes.io/dockerconfigjson \
            --from-literal=.dockerconfigjson='{"auths":{"https://index.docker.io/v1/":{"auth":"Y2ktdGVzdDpjaS10ZXN0"}}}'

          kubectl apply -f - <<'EOF'
          apiVersion: ops.alexellis.io/v1
          kind: ClusterPullSecret
          metadata:
            name: registry-creds-ci
          spec:
            secretRef:
              name: registry-creds-ci-seed
              namespace: kube-system
          EOF

          for attempt in {1..60}; do
            if kubectl get secret registry-creds-ci --namespace=default --output=name >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for registry-creds-ci in the default namespace"
              kubectl describe clusterpullsecret registry-creds-ci
              exit 1
            fi
            sleep 2
          done

          test "$(kubectl get secret registry-creds-ci --namespace=default --output=jsonpath='{.type}')" = "kubernetes.io/dockerconfigjson"
          seed_data=$(kubectl get secret registry-creds-ci-seed --namespace=kube-system --output=jsonpath='{.data.\.dockerconfigjson}')
          replicated_data=$(kubectl get secret registry-creds-ci --namespace=default --output=jsonpath='{.data.\.dockerconfigjson}')
          test "$replicated_data" = "$seed_data"
